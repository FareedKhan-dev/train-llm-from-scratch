name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and config
      description: The exact command you ran, and any config or flags you changed.
      render: bash
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Full error output
      render: text
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: |
        Output of:
        python -c "import torch, sys; print(sys.version); print(torch.__version__, torch.cuda.is_available())"
      render: text
    validations:
      required: true
